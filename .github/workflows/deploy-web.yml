name: Deploy web to GitHub Pages

# Builds the browser page (tools/build_web.py: only the files the page needs) and publishes it to legacy/ of the gh-pages
# branch of the public repo (https://foolshang.github.io/PoE-Filter-Generator/legacy/); the root belongs to the TypeScript page.
# Called by release.yml for a real release; run it by hand to deploy the web alone again.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.13.5)'
        required: true
        type: string
    secrets:
      RELEASE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v0.13.5); it must match poe_price_trade/__init__.py of the ref you run this on'
        required: true

env:
  PUBLIC_REPO: foolshang/PoE-Filter-Generator
  SITE_URL: https://foolshang.github.io/PoE-Filter-Generator

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # the names snapshot the page ships: refreshed from GGG's trade data; a list that shrank by more than 20% (or a
      # failed download) is not written - the committed snapshot stays and the log says so
      - name: Refresh trade names snapshot
        shell: bash
        run: |
          if python tools/refresh_web_names.py; then
            echo "names snapshot refreshed"
          else
            echo "::warning::trade names snapshot not refreshed (shrank by more than 20% or download failed) - the committed snapshot is deployed"
          fi

      - name: Build the site (version must match the tag)
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: python tools/build_web.py --out _site --tag "$TAG"

      # The TypeScript page owns the root of gh-pages (and the old page lives in /legacy/): this job writes /legacy/ only,
      # with a normal commit on top of the branch - never a force push, never a change to anything outside legacy/.
      - name: Publish the old page to legacy/ of gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          git clone -q --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" pages
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf legacy
          mkdir legacy
          cp -r ../_site/. legacy/
          git add -A legacy
          git commit -q -m "legacy web $TAG" || { echo "legacy/ already up to date"; exit 0; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" gh-pages

      # The live page must report the tag's version (Pages needs a minute or two to publish)
      - name: Verify the live site
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          want="${TAG#v}"; want="${want%%-*}"
          for i in $(seq 1 30); do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "$SITE_URL/legacy/py/__init__.py?t=$(date +%s)" 2>/dev/null | sed -n 's/.*__version__ *= *"\([^"]*\)".*/\1/p') || got=""
            echo "try $i: live version '$got' (want '$want')"
            if [ "$got" = "$want" ]; then
              curl -fsS "$SITE_URL/legacy/" | grep -q "app.js?v=$want" && { echo "site is live: $SITE_URL/legacy/"; exit 0; }
            fi
            sleep 10
          done
          echo "::error::$SITE_URL did not serve $want after 5 minutes (is Pages enabled?)"
          exit 1
