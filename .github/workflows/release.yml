name: Build & Release Standalone

on:
  push:
    tags: ['v*']                 # push a tag like v0.8.7 -> runs automatically
  workflow_dispatch:             # or run by hand from the Actions tab
    inputs:
      version:
        description: 'Release tag (e.g. v0.8.7)'
        required: true

jobs:
  # The web page goes to GitHub Pages first (a prerelease tag such as v0.13.5-test never deploys). A failed deploy does not
  # stop the exe release below, but the README (which links the web page) is then not updated.
  web:
    if: ${{ false }}                 # the TypeScript repo owns the web page now (its deploy-web.yml); this one only keeps /legacy/
    uses: ./.github/workflows/deploy-web.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build-release:
    needs: web
    if: ${{ !cancelled() }}          # runs also when the web job failed or was skipped (prerelease)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'          # the same interpreter the desktop build / in-game tests use

      # The standalone exe only needs the stdlib + tkinter (PoE-Filter-Generator.spec
      # excludes pystray/PIL/winrt), so don't install the checker-only dependencies
      # from requirements.txt — fewer things that can fail on the runner.
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==6.21.0"      # the version the local builds use (a float lets the exe change under us)

      - name: Resolve tag
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
          else
            tag="$REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # The exe embeds __version__ (window title / log marker): refuse to ship a tag
      # that doesn't match it. "v0.8.6-test" is accepted for v0.8.6 (suffix ignored).
      - name: Check tag matches __version__
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          src=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('poe_price_trade/__init__.py', encoding='utf-8').read()).group(1))")
          want="${TAG#v}"; want="${want%%-*}"
          echo "tag=$TAG  source __version__=$src"
          if [ "$want" != "$src" ]; then
            echo "::error::Tag $TAG does not match __version__ $src — bump poe_price_trade/__init__.py first"
            exit 1
          fi

      # a Windows checkout may turn LF into CRLF (autocrlf): .gitattributes keeps release/ LF, this proves it
      - name: Check release files use LF line endings
        shell: bash
        run: |
          if ! python -c "import sys; sys.exit(any(chr(13).encode() in open(f, 'rb').read() for f in sys.argv[1:]))" release/update_public_readme.sh release/README_public.md; then
            echo "::error::release/ files have CRLF line endings - check .gitattributes"
            exit 1
          fi

      - name: Build standalone exe
        run: pyinstaller PoE-Filter-Generator.spec --noconfirm

      - name: Check exe exists
        shell: bash
        run: ls -la dist/PoE-Filter-Generator.exe

      - name: Publish release to public repo
        # the TypeScript release owns "Latest" now: this old build is only published on purpose (Run workflow with a tag like v0.99.0-legacy)
        if: ${{ github.event_name == 'workflow_dispatch' && contains(inputs.version, 'legacy') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;   # v0.8.6-test -> prerelease, never becomes "Latest"
          esac
          gh release create "$TAG" \
            --repo foolshang/PoE-Filter-Generator \
            --title "PoE Filter Generator $TAG" \
            --notes "Standalone PoE1 & PoE2 Filter Generator. ถ้าเจอ error เขียนไฟล์ไม่ได้ / [Errno 9] ดูหัวข้อ 'แก้ปัญหา' (Controlled Folder Access) ใน README." \
            $PRERELEASE \
            "dist/PoE-Filter-Generator.exe"

      # The public README lives in this repo (release/README_public.md). A real release also puts it into the public
      # repo; a prerelease (tag with "-", e.g. v0.11.0-test) never touches it. No change = no commit.
      - name: Update README in public repo
        if: ${{ false }}                 # the README of the public repo is the TypeScript one now
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: bash release/update_public_readme.sh

      - name: README not updated (web deploy failed)
        if: ${{ false }}
        shell: bash
        run: echo "::warning::the web deploy did not succeed (${{ needs.web.result }}) - the README (with the link to the web page) was NOT updated; fix the deploy and run Deploy web + update the README by hand"
